<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinseltown Studio — Movie Moguls 2026</title>
<style>
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:#7A6330;--black:#080808;--card:#141414;--border:#2A2318;--border-gold:rgba(201,168,76,0.25);--text:#F5EDD6;--muted:#6B5E44;--red-carpet:#8B1A1A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(201,168,76,0.015) 40px,rgba(201,168,76,0.015) 41px),repeating-linear-gradient(-45deg,transparent,transparent 40px,rgba(201,168,76,0.015) 40px,rgba(201,168,76,0.015) 41px);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:0 20px 48px}
.header{text-align:center;padding:40px 20px 30px;position:relative}
.header::before,.header::after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto;width:80%}
.header::before{margin-bottom:24px}.header::after{margin-top:24px}
.marquee-dots{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.marquee-dot{width:7px;height:7px;border-radius:50%;background:var(--gold-dim);animation:bulb 2.4s ease-in-out infinite}
.marquee-dot:nth-child(2){animation-delay:.3s}.marquee-dot:nth-child(3){animation-delay:.6s}.marquee-dot:nth-child(4){animation-delay:.9s}.marquee-dot:nth-child(5){animation-delay:1.2s}.marquee-dot:nth-child(6){animation-delay:1.5s}.marquee-dot:nth-child(7){animation-delay:1.8s}
@keyframes bulb{0%,100%{background:var(--gold-dim)}50%{background:var(--gold-light);box-shadow:0 0 8px var(--gold)}}
.studio-label{font-size:10px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--gold-dim);margin-bottom:8px}
.title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(36px,6vw,68px);font-weight:900;line-height:.95;color:var(--text);letter-spacing:-1px;font-style:italic}
.title span{display:block;font-size:.52em;color:var(--gold);letter-spacing:2px;font-weight:700}
.subtitle{font-family:Garamond,Georgia,serif;font-size:15px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:12px}
.data-badge{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 28px;font-size:11px;color:var(--gold-dim);letter-spacing:1px;font-weight:300}
.data-badge::before,.data-badge::after{content:'◆';font-size:7px}
.tabs{display:flex;border-bottom:1px solid var(--border-gold);margin-bottom:28px}
.tab{flex:1;padding:11px 8px;background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;position:relative}
.tab::after{content:'';position:absolute;bottom:-1px;left:50%;right:50%;height:2px;background:var(--gold);transition:all .3s}
.tab:hover{color:var(--text)}.tab.active{color:var(--gold)}.tab.active::after{left:10%;right:10%}
.leaderboard{display:flex;flex-direction:column;gap:12px}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:18px 22px;position:relative;overflow:hidden;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.team-card:nth-child(1){animation-delay:.05s}.team-card:nth-child(2){animation-delay:.1s}.team-card:nth-child(3){animation-delay:.15s}.team-card:nth-child(4){animation-delay:.2s}
.team-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--border-gold),transparent)}
.team-card.rank-1::before{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rank-stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.rank-1 .rank-stripe{background:linear-gradient(180deg,var(--gold-light),var(--gold))}.rank-2 .rank-stripe{background:#888}.rank-3 .rank-stripe{background:#7B4F1E}
.team-row{display:flex;align-items:flex-start;gap:18px;margin-bottom:14px}
.rank-num{font-family:Georgia,'Times New Roman',serif;font-size:38px;font-weight:900;font-style:italic;line-height:1;width:44px;flex-shrink:0;color:var(--border)}
.rank-1 .rank-num{color:var(--gold);text-shadow:0 0 30px rgba(201,168,76,.3)}.rank-2 .rank-num{color:#555}.rank-3 .rank-num{color:#4A3018}
.team-info{flex:1}
.team-name{font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;color:var(--text);margin-bottom:3px}
.team-meta{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.team-total{text-align:right}
.team-total-num{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;color:var(--text);display:block}
.rank-1 .team-total-num{color:var(--gold)}
.team-total-label{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.progress-track{height:2px;background:var(--border);margin-bottom:12px;border-radius:1px}
.progress-fill{height:100%;border-radius:1px;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.films-row{display:flex;flex-wrap:wrap;gap:5px}
.film-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--border);font-size:10px;color:var(--muted);border-radius:1px}
.film-tag.has-earnings{border-color:rgba(201,168,76,.3);color:var(--text)}
.slot-pip{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pip-anchor{background:var(--red-carpet)}.pip-family{background:#2A6B3A}.pip-wildcard{background:var(--border-gold);opacity:.6}
.film-earnings{color:var(--gold);font-weight:600}.film-date{color:var(--border-gold);font-style:italic}
.chart-section{display:flex;flex-direction:column;gap:9px}
.chart-row{display:grid;grid-template-columns:160px 1fr 88px;align-items:center;gap:12px}
.chart-label{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-track{height:24px;background:#0a0a0a;border:1px solid var(--border);border-radius:1px;overflow:hidden}
.chart-bar{height:100%;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:600;white-space:nowrap}
.chart-bar-anchor{background:linear-gradient(90deg,#5A1010,var(--red-carpet));color:#FFB3B3}
.chart-bar-family{background:linear-gradient(90deg,#1A4A28,#2A8A48);color:#A8FFB8}
.chart-bar-wildcard{background:linear-gradient(90deg,#2A2318,#4A3D28);color:var(--gold-light)}
.chart-empty{display:flex;align-items:center;padding:0 12px;height:100%;font-size:10px;color:var(--muted);font-style:italic}
.chart-value{font-size:11px;color:var(--gold);font-weight:600}
.h2h-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.h2h-card{background:var(--card);border:1px solid var(--border);padding:18px;border-radius:2px;position:relative}
.h2h-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--border-gold),transparent)}
.h2h-rank{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.h2h-name{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:700;margin-bottom:5px}
.h2h-total{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:900;margin-bottom:4px}
.h2h-sub{font-size:10px;color:var(--muted);letter-spacing:1px}
.h2h-bar-track{height:3px;background:var(--border);margin-top:12px;border-radius:1px}
.h2h-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:1px}
.gap-analysis{background:var(--card);border:1px solid var(--border);border-radius:2px;overflow:hidden}
.gap-header{padding:11px 18px;border-bottom:1px solid var(--border);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.gap-row{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border);font-size:12px}
.gap-row:last-child{border-bottom:none}
.gap-label{color:var(--muted);font-size:10px;letter-spacing:1px}
.gap-amount{color:var(--gold);font-family:Georgia,'Times New Roman',serif;font-size:15px;font-weight:700}
.schedule-table{width:100%;border-collapse:collapse}
.schedule-table th{text-align:left;padding:9px 13px;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border-gold);font-weight:600}
.schedule-table td{padding:10px 13px;border-bottom:1px solid var(--border);font-size:12px}
.schedule-table tr:hover td{background:rgba(201,168,76,.03)}
.status-live{color:var(--gold);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.status-live::before{content:'◆ ';font-size:7px}
.status-upcoming{color:var(--muted);font-size:10px;font-style:italic}
.gross-cell{font-family:Georgia,'Times New Roman',serif;font-size:15px;color:var(--gold);font-weight:700}
.slot-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.footer-deco{text-align:center;margin-top:36px;padding-top:18px}
.footer-deco::before{content:'◆ ◇ ◆';color:var(--gold-dim);letter-spacing:10px;font-size:10px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:20px;transition:color .2s}
.back-link:hover{color:var(--gold)}
@media(max-width:580px){.chart-row{grid-template-columns:90px 1fr 70px;gap:8px}.h2h-grid{grid-template-columns:1fr}.team-total-num{font-size:20px}}
</style>
</head>
<body>
<div class="app">
  <div style="padding-top:24px"><a class="back-link" href="index.html">← All Studios</a></div>
  <div class="header">
    <div class="marquee-dots"><div class="marquee-dot"></div><div class="marquee-dot"></div><div class="marquee-dot"></div><div class="marquee-dot"></div><div class="marquee-dot"></div><div class="marquee-dot"></div><div class="marquee-dot"></div></div>
    <div class="studio-label">Tinseltown Studio Presents</div>
    <div class="title">Movie Moguls<span>2026 Season</span></div>
    <div class="subtitle">Box Office Championship</div>
  </div>
  <div class="data-badge" id="data-badge">Live Data · Box Office Mojo</div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('leaderboard',this)">Standings</button>
    <button class="tab" onclick="switchTab('chart',this)">Box Office</button>
    <button class="tab" onclick="switchTab('h2h',this)">Head to Head</button>
    <button class="tab" onclick="switchTab('schedule',this)">Schedule</button>
  </div>
  <div id="content"></div>
  <div class="footer-deco"></div>
</div>
<script src="data.js"></script>
<script>
// Roster data — edit data.js for earnings, edit here for team/film changes
const RD={"moana":"Jul 10","the mandalorian & grogu":"Released","masters of the universe":"Released","resident evil":"Sep 18","evil dead: burn":"Jul 10","spider-man":"Jul 31","disclosure day":"TBD","paw patrol":"Aug 14","the sheep detectives":"Released","practical magic 2":"Sep 11","the odyssey":"Jul 17","minions & monsters":"Released","mortal kombat 2":"Released","animal farm":"Released","power ballad":"TBD","toy story 5":"Released","the devil wears prada 2":"Released","supergirl":"Released","scary movie":"Released","backrooms":"Released","hokum":"Released","coyote v. acme":"Aug 28","end of oak street":"Aug 14","jailer 2 (india)":"Oct 15"};
const TEAMS=[{name:"Reel Ones",films:[{t:"Moana",s:"family"},{t:"The Mandalorian & Grogu",s:"anchor"},{t:"Masters of the Universe",s:"wildcard"},{t:"Resident Evil",s:"wildcard"},{t:"Evil Dead: Burn",s:"wildcard"}]},{name:"Studio Cinemagda",films:[{t:"Spider-Man",s:"anchor"},{t:"Disclosure Day",s:"wildcard"},{t:"Paw Patrol",s:"family"},{t:"The Sheep Detectives",s:"wildcard"},{t:"Practical Magic 2",s:"wildcard"}]},{name:"Cash Me If You Can",films:[{t:"The Odyssey",s:"anchor"},{t:"Minions & Monsters",s:"family"},{t:"Mortal Kombat 2",s:"wildcard"},{t:"Animal Farm",s:"wildcard"},{t:"Power Ballad",s:"wildcard"}]},{name:"The Devil Wears Victory",films:[{t:"Toy Story 5",s:"family"},{t:"The Devil Wears Prada 2",s:"anchor"},{t:"Supergirl",s:"wildcard"},{t:"Scary Movie",s:"wildcard"},{t:"Backrooms",s:"wildcard"}]}];

// Wire up data from data.js
document.getElementById('data-badge').textContent = 'Live Data · Box Office Mojo · ' + LAST_UPDATED;

function earn(t){return(EARNINGS[t.toLowerCase().trim()])||0;}
function rd(t){return RD[t.toLowerCase().trim()]||"TBD";}
function fmt(n){if(!n)return"—";if(n>=1e9)return"$"+(n/1e9).toFixed(2)+"B";if(n>=1e6)return"$"+(n/1e6).toFixed(1)+"M";return"$"+(n/1e3).toFixed(0)+"K";}
function total(t){return t.films.reduce((s,f)=>s+earn(f.t),0);}
function sorted(){return[...TEAMS].map(t=>({...t,total:total(t)})).sort((a,b)=>b.total-a.total);}
let currentTab='leaderboard';
function rankColor(i){return i===0?'var(--gold)':i===1?'#888':i===2?'#7B4F1E':'var(--muted)';}
function renderLeaderboard(){const teams=sorted();const max=teams[0].total||1;return'<div class="leaderboard">'+teams.map((t,i)=>{const pct=max>0?(t.total/max*100):0;const ec=t.films.filter(f=>earn(f.t)>0).length;const tags=t.films.map(f=>{const e=earn(f.t);return`<span class="film-tag ${e>0?'has-earnings':''}"><span class="slot-pip pip-${f.s}"></span>${f.t}${e>0?`<span class="film-earnings"> ${fmt(e)}</span>`:`<span class="film-date"> ${rd(f.t)}</span>`}</span>`;}).join('');return`<div class="team-card rank-${i+1}"><div class="rank-stripe"></div><div class="team-row"><div class="rank-num">${i+1}</div><div class="team-info"><div class="team-name">${t.name}</div><div class="team-meta">${ec} of 5 films earning</div></div><div class="team-total"><span class="team-total-num">${t.total>0?fmt(t.total):'$0'}</span><span class="team-total-label">Worldwide</span></div></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="films-row">${tags}</div></div>`;}).join('')+'</div>';}
function renderChart(){const teams=sorted();const seen=new Set(),all=[];teams.forEach(t=>t.films.forEach(f=>{const k=f.t.toLowerCase();if(!seen.has(k)){seen.add(k);all.push({t:f.t,s:f.s,e:earn(f.t)});}}));all.sort((a,b)=>b.e-a.e);const max=all.find(x=>x.e>0)?.e||1;const legend=`<div style="display:flex;gap:16px;margin-bottom:18px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)"><span><span style="display:inline-block;width:8px;height:8px;background:var(--red-carpet);border-radius:1px;margin-right:4px;vertical-align:middle"></span>Anchor</span><span><span style="display:inline-block;width:8px;height:8px;background:#2A8A48;border-radius:1px;margin-right:4px;vertical-align:middle"></span>Family</span><span><span style="display:inline-block;width:8px;height:8px;background:var(--gold-dim);border-radius:1px;margin-right:4px;vertical-align:middle"></span>Wildcard</span></div>`;const rows=all.map(f=>{const pct=f.e>0?Math.max(f.e/max*100,1):0;return`<div class="chart-row"><div class="chart-label">${f.t}</div><div class="chart-track">${f.e>0?`<div class="chart-bar chart-bar-${f.s}" style="width:${pct}%">${fmt(f.e)}</div>`:`<div class="chart-empty">Opens ${rd(f.t)}</div>`}</div><div class="chart-value">${fmt(f.e)}</div></div>`;}).join('');return legend+'<div class="chart-section">'+rows+'</div>';}
function renderH2H(){const teams=sorted();const max=teams[0].total||1;const cards=teams.map((t,i)=>{const c=rankColor(i);const pct=max>0?t.total/max*100:0;const ec=t.films.filter(f=>earn(f.t)>0).length;return`<div class="h2h-card"><div class="h2h-rank">Rank #${i+1}</div><div class="h2h-name" style="color:${c}">${t.name}</div><div class="h2h-total" style="color:${c}">${t.total>0?fmt(t.total):'$0'}</div><div class="h2h-sub">${ec} / 5 films earning</div><div class="h2h-bar-track"><div class="h2h-bar-fill" style="width:${pct}%"></div></div></div>`;}).join('');const gaps=teams.map((t,i)=>i<teams.length-1?`<div class="gap-row"><span class="gap-label">#${i+1} ${teams[i].name} leads #${i+2} ${teams[i+1].name}</span><span class="gap-amount">${fmt(teams[i].total-teams[i+1].total)||'$0'}</span></div>`:'').join('');return`<div class="h2h-grid">${cards}</div><div class="gap-analysis"><div class="gap-header">Gap Analysis</div>${gaps}</div>`;}
function renderSchedule(){const teams=sorted();const seen=new Set(),all=[];teams.forEach(t=>t.films.forEach(f=>{const k=f.t.toLowerCase();if(!seen.has(k)){seen.add(k);all.push({t:f.t,s:f.s,e:earn(f.t),rd:rd(f.t)});}}));const live=all.filter(x=>x.e>0).sort((a,b)=>b.e-a.e);const upcoming=all.filter(x=>x.e===0);const rows=[...live,...upcoming].map(f=>`<tr><td style="font-family:Garamond,Georgia,serif;font-size:15px;color:var(--text)">${f.t}</td><td><span class="slot-label">${f.s}</span></td><td>${f.e>0?`<span class="status-live">Earning</span>`:`<span class="status-upcoming">${f.rd}</span>`}</td><td class="gross-cell">${fmt(f.e)}</td></tr>`).join('');return`<table class="schedule-table"><thead><tr><th>Film</th><th>Slot</th><th>Status</th><th>Worldwide</th></tr></thead><tbody>${rows}</tbody></table>`;}
function switchTab(tab,btn){currentTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function render(){const c=document.getElementById('content');if(currentTab==='leaderboard')c.innerHTML=renderLeaderboard();else if(currentTab==='chart')c.innerHTML=renderChart();else if(currentTab==='h2h')c.innerHTML=renderH2H();else c.innerHTML=renderSchedule();}
render();
</script>
</body>
</html>
