<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinseltown Studio — Movie Moguls 2026</title>
<style>
/* System font stacks — no external dependencies */

:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-dim: #7A6330;
  --black: #080808;
  --surface: #0F0F0F;
  --card: #141414;
  --border: #2A2318;
  --border-gold: rgba(201,168,76,0.25);
  --text: #F5EDD6;
  --muted: #6B5E44;
  --red-carpet: #8B1A1A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--black);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Art deco background pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(201,168,76,0.015) 40px, rgba(201,168,76,0.015) 41px),
    repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(201,168,76,0.015) 40px, rgba(201,168,76,0.015) 41px);
  pointer-events: none;
  z-index: 0;
}

.app { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 20px 60px; }

/* ── HEADER ── */
.header {
  text-align: center;
  padding: 48px 20px 36px;
  position: relative;
}

.header::before, .header::after {
  content: '';
  display: block;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto;
  width: 80%;
}
.header::before { margin-bottom: 28px; }
.header::after { margin-top: 28px; }

.marquee-dots {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 18px;
}
.marquee-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--gold-dim);
  animation: bulb 2.4s ease-in-out infinite;
}
.marquee-dot:nth-child(2) { animation-delay: 0.3s; }
.marquee-dot:nth-child(3) { animation-delay: 0.6s; }
.marquee-dot:nth-child(4) { animation-delay: 0.9s; }
.marquee-dot:nth-child(5) { animation-delay: 1.2s; }
.marquee-dot:nth-child(6) { animation-delay: 1.5s; }
.marquee-dot:nth-child(7) { animation-delay: 1.8s; }
@keyframes bulb { 0%,100%{background:var(--gold-dim)} 50%{background:var(--gold-light);box-shadow:0 0 8px var(--gold)} }

.studio-label {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin-bottom: 10px;
}

.title {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(40px, 7vw, 76px);
  font-weight: 900;
  line-height: 0.95;
  color: var(--text);
  letter-spacing: -1px;
}

.title span {
  display: block;
  font-style: italic;
  font-size: 0.55em;
  color: var(--gold);
  letter-spacing: 2px;
  font-weight: 700;
}

.subtitle {
  font-family: Garamond, Georgia, serif;
  font-size: 16px;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 14px;
}

/* ── DATA BADGE ── */
.data-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 0 auto 32px;
  font-size: 11px;
  color: var(--gold-dim);
  letter-spacing: 1px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  font-weight: 300;
}
.data-badge::before, .data-badge::after {
  content: '◆';
  font-size: 7px;
  color: var(--gold-dim);
}

/* ── TABS ── */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border-gold);
  margin-bottom: 32px;
  gap: 0;
}
.tab {
  flex: 1;
  padding: 12px 8px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.tab::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 50%; right: 50%;
  height: 2px;
  background: var(--gold);
  transition: all 0.3s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--gold); }
.tab.active::after { left: 10%; right: 10%; }

/* ── LEADERBOARD ── */
.leaderboard { display: flex; flex-direction: column; gap: 14px; }

.team-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 20px 24px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
  animation: fadeUp 0.4s ease both;
}

@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.team-card:nth-child(1) { animation-delay: 0.05s; }
.team-card:nth-child(2) { animation-delay: 0.1s; }
.team-card:nth-child(3) { animation-delay: 0.15s; }
.team-card:nth-child(4) { animation-delay: 0.2s; }

.team-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
}
.team-card.rank-1::before { background: linear-gradient(90deg, transparent, var(--gold), transparent); }

.team-card:hover { border-color: var(--border-gold); }

.rank-stripe {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.rank-1 .rank-stripe { background: linear-gradient(180deg, var(--gold-light), var(--gold)); }
.rank-2 .rank-stripe { background: #888; }
.rank-3 .rank-stripe { background: #7B4F1E; }

.team-row {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 16px;
}

.rank-num {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 42px;
  font-weight: 900;
  font-style: italic;
  line-height: 1;
  width: 48px;
  flex-shrink: 0;
  color: var(--border);
}
.rank-1 .rank-num { color: var(--gold); text-shadow: 0 0 30px rgba(201,168,76,0.3); }
.rank-2 .rank-num { color: #555; }
.rank-3 .rank-num { color: #4A3018; }

.team-info { flex: 1; }

.team-name {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
}

.team-meta {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 400;
}

.team-total {
  text-align: right;
}
.team-total-num {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  display: block;
}
.rank-1 .team-total-num { color: var(--gold); }
.team-total-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}

.progress-track {
  height: 2px;
  background: var(--border);
  margin-bottom: 14px;
  border-radius: 1px;
}
.progress-fill {
  height: 100%;
  border-radius: 1px;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width 1s ease;
}

.films-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.film-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.5px;
  color: var(--muted);
  border-radius: 1px;
  transition: border-color 0.2s;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
}
.film-tag.has-earnings {
  border-color: rgba(201,168,76,0.3);
  color: var(--text);
}
.slot-pip {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pip-anchor { background: var(--red-carpet); }
.pip-family { background: #2A6B3A; }
.pip-wildcard { background: var(--border-gold); opacity: 0.6; }
.film-earnings { color: var(--gold); font-weight: 600; }
.film-date { color: var(--border-gold); font-style: italic; }

/* ── BAR CHART ── */
.chart-section { display: flex; flex-direction: column; gap: 10px; }
.chart-row { display: grid; grid-template-columns: 170px 1fr 90px; align-items: center; gap: 14px; }
.chart-label { font-size: 11px; color: var(--muted); text-align: right; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.5px; }
.chart-track { height: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 1px; overflow: hidden; }
.chart-bar { height: 100%; display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: 600; white-space: nowrap; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
.chart-bar-anchor { background: linear-gradient(90deg, #5A1010, var(--red-carpet)); color: #FFB3B3; }
.chart-bar-family { background: linear-gradient(90deg, #1A4A28, #2A8A48); color: #A8FFB8; }
.chart-bar-wildcard { background: linear-gradient(90deg, #2A2318, #4A3D28); color: var(--gold-light); }
.chart-empty { display: flex; align-items: center; padding: 0 12px; height: 100%; font-size: 10px; color: var(--muted); letter-spacing: 1px; font-style: italic; font-family: Garamond, Georgia, serif; }
.chart-value { font-size: 11px; color: var(--gold); font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }

/* ── H2H ── */
.h2h-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.h2h-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 20px;
  border-radius: 2px;
  position: relative;
}
.h2h-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
}
.h2h-rank { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.h2h-name { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.h2h-total { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; font-weight: 900; margin-bottom: 4px; }
.h2h-sub { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.h2h-bar-track { height: 3px; background: var(--border); margin-top: 14px; border-radius: 1px; }
.h2h-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 1px; }
.gap-analysis {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.gap-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}
.gap-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.gap-row:last-child { border-bottom: none; }
.gap-label { color: var(--muted); font-size: 10px; letter-spacing: 1px; }
.gap-amount { color: var(--gold); font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: 700; }

/* ── SCHEDULE TABLE ── */
.schedule-table { width: 100%; border-collapse: collapse; }
.schedule-table th {
  text-align: left; padding: 10px 14px;
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--border-gold);
  font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
}
.schedule-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
.schedule-table tr:hover td { background: rgba(201,168,76,0.03); }
.status-live { color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.status-live::before { content: '◆ '; font-size: 7px; }
.status-upcoming { color: var(--muted); font-size: 10px; font-style: italic; font-family: Garamond, Georgia, serif; letter-spacing: 0.5px; }
.gross-cell { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; color: var(--gold); font-weight: 700; }
.slot-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }

/* ── FOOTER DECO ── */
.footer-deco {
  text-align: center;
  margin-top: 40px;
  padding-top: 20px;
}
.footer-deco::before {
  content: '◆ ◇ ◆';
  color: var(--gold-dim);
  letter-spacing: 10px;
  font-size: 10px;
}

@media(max-width:600px) {
  .chart-row { grid-template-columns: 100px 1fr 70px; gap: 8px; }
  .h2h-grid { grid-template-columns: 1fr; }
  .team-total-num { font-size: 20px; }
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="marquee-dots">
      <div class="marquee-dot"></div><div class="marquee-dot"></div>
      <div class="marquee-dot"></div><div class="marquee-dot"></div>
      <div class="marquee-dot"></div><div class="marquee-dot"></div>
      <div class="marquee-dot"></div>
    </div>
    <div class="studio-label">Tinseltown Studio Presents</div>
    <div class="title">
      Movie Moguls
      <span>2026 Season</span>
    </div>
    <div class="subtitle">Box Office Championship</div>
  </div>

  <div class="data-badge">Live Data · Box Office Mojo · May 8, 2026</div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('leaderboard',this)">Standings</button>
    <button class="tab" onclick="switchTab('chart',this)">Box Office</button>
    <button class="tab" onclick="switchTab('h2h',this)">Head to Head</button>
    <button class="tab" onclick="switchTab('schedule',this)">Schedule</button>
  </div>

  <div id="content"></div>

  <div class="footer-deco"></div>
</div>

<script>
const E = {
  "the devil wears prada 2": 253245284,
  "hokum": 10647998,
  "animal farm": 4155712
};
const RD = {
  "moana":"Jul 25, 2026","the mandalorian & grogu":"May 22, 2026",
  "masters of the universe":"Jun 5, 2026","spider-man":"Jul 31, 2026",
  "the odyssey":"Jul 3, 2026","minions & monsters":"Jul 2, 2026",
  "mortal kombat 2":"TBD","animal farm":"Released","power ballad":"TBD",
  "toy story 5":"Jun 19, 2026","the devil wears prada 2":"Released",
  "supergirl":"Jun 26, 2026","scary movie":"TBD","backrooms":"TBD",
  "hokum":"Released","coyote v. acme":"TBD","end of oak street":"TBD",
  "jailer 2 (india)":"TBD","resident evil":"TBD","evil dead: burn":"TBD",
  "disclosure day":"TBD","paw patrol":"TBD","the sheep detectives":"TBD","practical magic 2":"TBD"
};

const TEAMS = [
  {name:"Reel Ones", films:[
    {t:"Moana",s:"family"},{t:"The Mandalorian & Grogu",s:"anchor"},
    {t:"Masters of the Universe",s:"wildcard"},{t:"Resident Evil",s:"wildcard"},{t:"Evil Dead: Burn",s:"wildcard"}
  ]},
  {name:"Studio Cinemagda", films:[
    {t:"Spider-Man",s:"anchor"},{t:"Disclosure Day",s:"wildcard"},
    {t:"Paw Patrol",s:"family"},{t:"The Sheep Detectives",s:"wildcard"},{t:"Practical Magic 2",s:"wildcard"}
  ]},
  {name:"Cash Me If You Can", films:[
    {t:"The Odyssey",s:"anchor"},{t:"Minions & Monsters",s:"family"},
    {t:"Mortal Kombat 2",s:"wildcard"},{t:"Animal Farm",s:"wildcard"},{t:"Power Ballad",s:"wildcard"}
  ]},
  {name:"The Devil Wears Victory", films:[
    {t:"Toy Story 5",s:"family"},{t:"The Devil Wears Prada 2",s:"anchor"},
    {t:"Supergirl",s:"wildcard"},{t:"Scary Movie",s:"wildcard"},{t:"Backrooms",s:"wildcard"}
  ]}
];

function earn(t){ return E[t.toLowerCase().trim()]||0; }
function rd(t){ return RD[t.toLowerCase().trim()]||"TBD"; }
function fmt(n){
  if(!n)return"—";
  if(n>=1e9)return"$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6)return"$"+(n/1e6).toFixed(1)+"M";
  return"$"+(n/1e3).toFixed(0)+"K";
}
function total(team){ return team.films.reduce((s,f)=>s+earn(f.t),0); }
function sorted(){ return [...TEAMS].map(t=>({...t,total:total(t)})).sort((a,b)=>b.total-a.total); }

let currentTab = 'leaderboard';

function rankColor(i){ return i===0?'var(--gold)':i===1?'#888':i===2?'#7B4F1E':'var(--muted)'; }

function renderLeaderboard(){
  const teams = sorted();
  const max = teams[0].total||1;
  return '<div class="leaderboard">'+teams.map((t,i)=>{
    const pct = max>0?(t.total/max*100):0;
    const ec = t.films.filter(f=>earn(f.t)>0).length;
    const tags = t.films.map(f=>{
      const e=earn(f.t);
      return `<span class="film-tag ${e>0?'has-earnings':''}">
        <span class="slot-pip pip-${f.s}"></span>
        ${f.t}
        ${e>0?`<span class="film-earnings">${fmt(e)}</span>`:`<span class="film-date">${rd(f.t)}</span>`}
      </span>`;
    }).join('');
    return `<div class="team-card rank-${i+1}">
      <div class="rank-stripe"></div>
      <div class="team-row">
        <div class="rank-num">${i+1}</div>
        <div class="team-info">
          <div class="team-name">${t.name}</div>
          <div class="team-meta">${ec} of 5 films earning</div>
        </div>
        <div class="team-total">
          <span class="team-total-num">${fmt(t.total)||'$0'}</span>
          <span class="team-total-label">Worldwide</span>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="films-row">${tags}</div>
    </div>`;
  }).join('')+'</div>';
}

function renderChart(){
  const teams = sorted();
  const seen=new Set(), all=[];
  teams.forEach(t=>t.films.forEach(f=>{
    const k=f.t.toLowerCase();
    if(!seen.has(k)){seen.add(k);all.push({t:f.t,s:f.s,e:earn(f.t)});}
  }));
  all.sort((a,b)=>b.e-a.e);
  const max=all.find(x=>x.e>0)?.e||1;
  const legend = `<div style="display:flex;gap:20px;margin-bottom:20px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)">
    <span><span style="display:inline-block;width:8px;height:8px;background:var(--red-carpet);border-radius:1px;margin-right:5px;vertical-align:middle"></span>Anchor</span>
    <span><span style="display:inline-block;width:8px;height:8px;background:#2A8A48;border-radius:1px;margin-right:5px;vertical-align:middle"></span>Family</span>
    <span><span style="display:inline-block;width:8px;height:8px;background:var(--gold-dim);border-radius:1px;margin-right:5px;vertical-align:middle"></span>Wildcard</span>
  </div>`;
  const rows=all.map(f=>{
    const pct=f.e>0?Math.max(f.e/max*100,1):0;
    const cls=`chart-bar-${f.s}`;
    return `<div class="chart-row">
      <div class="chart-label">${f.t}</div>
      <div class="chart-track">
        ${f.e>0
          ?`<div class="chart-bar ${cls}" style="width:${pct}%">${fmt(f.e)}</div>`
          :`<div class="chart-empty">Opens ${rd(f.t)}</div>`}
      </div>
      <div class="chart-value">${fmt(f.e)}</div>
    </div>`;
  }).join('');
  return legend+'<div class="chart-section">'+rows+'</div>';
}

function renderH2H(){
  const teams=sorted();
  const max=teams[0].total||1;
  const cards=teams.map((t,i)=>{
    const c=rankColor(i);
    const pct=max>0?t.total/max*100:0;
    const ec=t.films.filter(f=>earn(f.t)>0).length;
    return `<div class="h2h-card">
      <div class="h2h-rank">Rank #${i+1}</div>
      <div class="h2h-name" style="color:${c}">${t.name}</div>
      <div class="h2h-total" style="color:${c}">${fmt(t.total)||'$0'}</div>
      <div class="h2h-sub">${ec} / 5 films earning</div>
      <div class="h2h-bar-track"><div class="h2h-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  const gaps=teams.map((t,i)=>i<teams.length-1?`<div class="gap-row">
    <span class="gap-label">#${i+1} ${teams[i].name} leads #${i+2} ${teams[i+1].name}</span>
    <span class="gap-amount">${fmt(teams[i].total-teams[i+1].total)||'$0'}</span>
  </div>`:'').join('');
  return `<div class="h2h-grid">${cards}</div>
  <div class="gap-analysis">
    <div class="gap-header">Gap Analysis</div>
    ${gaps}
  </div>`;
}

function renderSchedule(){
  const teams=sorted();
  const seen=new Set(),all=[];
  teams.forEach(t=>t.films.forEach(f=>{
    const k=f.t.toLowerCase();
    if(!seen.has(k)){seen.add(k);all.push({t:f.t,s:f.s,e:earn(f.t),rd:rd(f.t)});}
  }));
  const live=all.filter(x=>x.e>0).sort((a,b)=>b.e-a.e);
  const upcoming=all.filter(x=>x.e===0);
  const rows=[...live,...upcoming].map(f=>`<tr>
    <td style="font-family:Garamond,Georgia,serif;font-size:15px;color:var(--text)">${f.t}</td>
    <td><span class="slot-label">${f.s}</span></td>
    <td>${f.e>0?`<span class="status-live">Earning</span>`:`<span class="status-upcoming">${f.rd}</span>`}</td>
    <td class="gross-cell">${fmt(f.e)}</td>
  </tr>`).join('');
  return `<table class="schedule-table">
    <thead><tr><th>Film</th><th>Slot</th><th>Status</th><th>Worldwide Gross</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function switchTab(tab, btn){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  const c=document.getElementById('content');
  if(currentTab==='leaderboard') c.innerHTML=renderLeaderboard();
  else if(currentTab==='chart') c.innerHTML=renderChart();
  else if(currentTab==='h2h') c.innerHTML=renderH2H();
  else c.innerHTML=renderSchedule();
}

render();
</script>
</body>
</html>
